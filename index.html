<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas - Mi Primera Clase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Calculadora de Notas 📚</h1>
        <p class="subtitle">Control de Calidad de Software - Tarea 1</p>

        <div class="input-group">
            <label for="nota1">Nota 1 (0 a 5):</label>
            <input type="number" id="nota1" min="0" max="5" step="0.1" placeholder="Ej. 3.5">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2 (0 a 5):</label>
            <input type="number" id="nota2" min="0" max="5" step="0.1" placeholder="Ej. 4.0">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3 (0 a 5):</label>
            <input type="number" id="nota3" min="0" max="5" step="0.1" placeholder="Ej. 2.8">
        </div>

        <button onclick="calcularPromedio()">Calcular Promedio</button>

        <div id="resultado" class="resultado hidden">
            <h2 id="texto-promedio">Promedio: --</h2>
            <p id="mensaje-estado">--</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
